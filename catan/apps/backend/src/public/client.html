<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Colyseus</title>
    <!--******************************************************************-->
    <!--En lugar de usar este importmap, en el frontend deben hacer un npm install @colyseus/sdk -->
    <script type="importmap">
    {
        "imports": {
            "@colyseus/sdk": "https://esm.sh/@colyseus/sdk@0.18.1"
        }
    }
    </script>

    <!--
    Ese install permite usar la libreria de colyseus en el frontend, 
    y permite la comunicacion con el backend, para crear salas, unirse a ellas, enviar mensajes.

    Las funciones mas clave son:
    - client.create("my_room") -> crea una sala en el backend, y devuelve un objeto room que representa la sala creada
    - client.joinById(roomId) -> se une a una sala existente, y devuelve un objeto room que representa la sala a la que se unio
    - room.send("message", "hola") -> envia un mensaje a todos los jugadores de la sala
    - room.send("privatemessage", {text: "hola", to: "sessionId"}) -> envia un mensaje privado a un jugador especifico, usando su sessionId
    
    El cliente notifica una intención al servidor (room.send("tipo", payload)),
    y el SERVIDOR decide qué hacer con ella: puede

    1) mutar el state (players, currentTurn, etc.) -> Colyseus lo sincroniza
     automáticamente a TODOS los clientes conectados, sin que nadie tenga
     que "enviar" nada explícitamente (ver room.onStateChange más abajo).

    2) responder con un mensaje puntual, dirigido a:
       - solo quien lo envió   (client.send(...))   
       - solo otro jugador     (targetClient.send(...))
       - todos los jugadores   (this.broadcast(...))

    3) no responder nada (ej: "play" solo actualiza el turno vía state).

    El nombre del handler ("play", "message", "rollDice", etc.) determina cuál
    de estos casos aplica -> revisar MyRoom.ts, seccion "messages", para saber
    exactamente qué hace cada uno antes de asumir su comportamiento.
      
    -->

</head>

<!-- Este archivo es el cliente para el juego de Colyseus, solamente es de prueba, 
 necesitan live server para probarlo, y asegurarse que la URL es correcta -->
<body>
    <!--******************************************************************-->
    <!-- Este archivo es el cliente para el juego de Colyseus, solamente es de prueba-->

    <h1 id="bienvenida">Bienvenido a Catan</h1>
    <h2 id="info">Ingresa el codigo de la sala, o crea una nueva</h2>
    <h3 id="miTurno">Esperando a que se conecte un jugador...</h3>

    <!--Input para poner el codigo de la sala-->
    <input type="text" id="roomCode" placeholder="Codigo de sala">
    <!--Boton para unirse a la sala-->
    <button id="btn-join">Unirse a la sala</button>
    <br>
    <!--Boton para crear una nueva sala-->
    <button id="btn-create">Crear nueva sala</button>

    <!--Boton para pasar el turno-->
    <button id="btn-pass">Pasar Turno</button>
    <h4>Tu codigo de jugador: <span id="playerCode"></span></h4>

    <!--Seccion para lanzar el dado-->
    <div id="dado">
        <h3>Lanzar Dado</h3>
        <p>Haz click en el boton para lanzar el dado</p>
        <button id="btn-roll">Lanzar Dado</button>
        <p id="diceResult"></p>
    </div>

    <!--Seccion para mostrar el historial de turnos-->
    <div id="history">
        <h3>Historial de Turnos</h3>
        <ul id="turnHistory">
        </ul>
    </div>

    <!--Seccion para el chat-->
    <div id="chat">
        <h3>chat:</h3>
        <p>Envia un mensaje</p>
        <input type="text" id="messageInput" placeholder="Escribe tu mensaje aquí">
        <button id="btn-send">Enviar Mensaje</button>
        <ul id="chatMessages">
        </ul>
    </div>

    <!--Seccion para el chat privado-->
    <div id="chatprivado">
        <h3>Chat Privado</h3>
        <p>Envia un mensaje privado</p>

        <input id="private-message" placeholder="Mensaje privado" type="text">
        <input id="private-receiver" placeholder="ID del jugador a enviar" type="text">
        <button id="btn-send-private">Enviar Mensaje Privado</button>

    </div>

</body>

<script type="module">
import { Client } from "@colyseus/sdk";

//Verificar que el URL de este cliente sea el correcto, si el backend esta corriendo en otro puerto, cambiarlo aqui
const client = new Client("ws://localhost:2567");
//Variable global para guardar la sala a la que se unio o creo el jugador
let room;

//Elementos del DOM para mostrar informacion al jugador
const miTurno = document.getElementById("miTurno");
const playerCode = document.getElementById("playerCode");
const lista = document.getElementById("chatMessages");
const info = document.getElementById("info");

// --- Se registra UNA SOLA VEZ, sin importar si creaste o te uniste ---
function setupRoomListeners() { 
    //Esto es para registrar los listeners de la sala
    //recibimos mensajes del estado de la sala, y de los handlers que definimos en el backend (revisar MyRoom.ts seccion messages)
    info.textContent = "Conectado a la sala con ID: " + room.roomId;
    playerCode.textContent = room.sessionId;

    //Reacciona ante cualquier cambio en el estado de la sala
    room.onStateChange((state) => {
        console.log("the room state has been updated:", state);
        miTurno.innerText = state.currentTurn === room.sessionId
            ? "Es tu turno"
            : "Esperando turno del otro jugador";
    });

    //los onmessage reaccionan a eventos puntuales, y mantiene el estado sincronizado

    //se activa al recibir algo en el handler message
    room.onMessage("message", (message) => {
        const li = document.createElement("li");
        li.textContent = message.from + ": " + message.text;
        lista.appendChild(li);
    });

    //se activa al recibir algo en el handler privatemessage
    room.onMessage("privatemessage", (message) => {
        const li = document.createElement("li");
        li.textContent = "Mensaje privado de " + message.from + ": " + message.text;
        lista.appendChild(li);
    });

    //se activa al recibir algo en el handler diceRolled
    room.onMessage("diceRolled", (result) =>{

        //esto es solo para cambiar el texto de la etiqueta al jugador que tiro el dado y ver que le toco
        if(result.from === room.sessionId){
            const diceResult = document.getElementById("diceResult");
            diceResult.textContent = `Resultado del dado ${result.result}`;

        }

        //solo actualiza la lista de turnos
        const historial = document.getElementById("turnHistory");
        const li = document.createElement("li");
        li.textContent = "El jugador " + result.from + " ha lanzado el dado y obtuvo: " + result.result;
        historial.appendChild(li);

    })
}

async function connect() {
    try {
        //nos conectamos a la sala del id que pusimos
        room = await client.joinById(document.getElementById("roomCode").value, {});
        console.log("Conectado a la sala");
        console.log("Room ID:", room.roomId);
        console.log("Session ID:", room.sessionId);
        setupRoomListeners();
    } catch (error) {
        console.error("Error connecting to room:", error);
    }
}

function passTurn(){
    if (!room) {
        console.warn("Todavía no estás conectado a la sala");
        return;
    }
    //con el handler play, pasamos turno
    room.send("play");
}

async function sendMessage() {
    if (!room) {
        console.warn("Todavía no estás conectado a la sala");
        return;
    }
    const messageInput = document.getElementById("messageInput");
    const messageText = messageInput.value.trim();
    if (messageText) {
        //se envia un mensaje al handler message, con el texto que estamos enviando
        room.send("message", messageText);
        messageInput.value = "";
    }
}

async function sendPrivateMessage(){
    if(!room){
        console.warn("Todavía no estás conectado a la sala");
        return;
    }
    const privateMessageInput = document.getElementById("private-message");
    const privateMessageText = privateMessageInput.value.trim();
    const privateReceiverInput = document.getElementById("private-receiver");
    const privateReceiverId = privateReceiverInput.value.trim();

    //se envia un mensaje al handler de privatemessage
    if (privateMessageText && privateReceiverId) {
        room.send("privatemessage", { text: privateMessageText, to: privateReceiverId });
        privateMessageInput.value = "";
        privateReceiverInput.value = "";
    }
}

async function rollDice() {
    if (!room) {
        console.warn("Todavía no estás conectado a la sala");
        return;
    }
    //el backend hace la logica de el dado en el handler rollDice, revisar backend
    room.send("rollDice");
}

// --- Todos los listeners de BOTONES se registran una sola vez, aquí ---
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("btn-join").addEventListener("click", connect);

    //crea una sala con las funciones de la libreria de colyseus 
    document.getElementById("btn-create").addEventListener("click", async () => {
        try {
            room = await client.create("my_room");
            console.log("Sala creada con ID:", room.roomId);
            setupRoomListeners();
        } catch (error) {
            console.error("Error creating room:", error);
        }
    });

    //agregando funciones a los botones
    document.getElementById("btn-send").addEventListener("click", sendMessage);
    document.getElementById("btn-pass").addEventListener("click", passTurn);
    document.getElementById("btn-send-private").addEventListener("click", sendPrivateMessage);
    document.getElementById("btn-roll").addEventListener("click", rollDice);
});
</script>
</html>
